[project]
name = "xml-proofread"
version = "0.1.0"
description = "CLI that proofreads <p> elements in XML with a GenAI model and marks mistakes with <error> tags"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8.0",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.7.4",
    "langcodes[data]>=3.5.1",
    "lxml>=6.1.3",
    "openai>=3.49.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
# This is a command-line app, not a library, so there is nothing to build or install.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules (main.py, xml_reader.py, ...) live in the project root.
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["temp_docs"]

[tool.ruff.lint]
# E/W: style, F: real mistakes (unused imports, undefined names), I: import order,
# B: likely bugs, UP: modern Python syntax, SIM: simpler code, N: naming conventions,
# D1: every module, class and function has a docstring, ANN: every function has type hints.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "D1", "ANN"]
# Any is the honest type for raw JSON/YAML data.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Tests compare exact XML output; keeping each expected string on one line is easier to read.
# Test functions are named after what they check, so they need no docstring.
"tests/*" = ["E501", "D1"]
